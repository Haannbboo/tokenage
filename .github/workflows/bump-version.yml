name: bump-version

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  bump:
    name: Bump patch version
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Bump changed package versions
        id: bump
        shell: bash
        env:
          # Via env, not inline ${{ }}: a base branch name may contain shell
          # syntax that would otherwise be substituted into the script itself.
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          BUMP_SERVER=false
          BUMP_CLIENT=false
          # Capture before looping: a process substitution hides git diff's exit
          # status, and a failed comparison (e.g. no merge base) would otherwise
          # leave both flags false and bump nothing while the job passed.
          if ! CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF...HEAD"); then
            echo "cannot compare origin/$BASE_REF with HEAD; is a merge base missing?" >&2
            exit 1
          fi
          while IFS= read -r FILE; do
            case "$FILE" in
              protocol/*)
                BUMP_SERVER=true
                BUMP_CLIENT=true
                ;;
              client/*|plugins/*)
                BUMP_CLIENT=true
                ;;
              install.sh)
                BUMP_SERVER=true
                BUMP_CLIENT=true
                ;;
              server/*|src/*|frontend/*|config.example.yaml|Dockerfile|.dockerignore|docker/*|VERSION)
                BUMP_SERVER=true
                ;;
            esac
          done <<< "$CHANGED_FILES"

          bump_file() {
            local FILE="$1"
            local CURRENT_VERSION BASE_VERSION CURRENT_MAJOR CURRENT_MINOR CURRENT_PATCH BASE_MAJOR BASE_MINOR BASE_PATCH NEW
            CURRENT_VERSION=$(cat "$FILE")
            BASE_VERSION=$(git show "origin/$BASE_REF:$FILE" 2>/dev/null || echo "0.0.0")
            if [[ ! "$CURRENT_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "$FILE must use MAJOR.MINOR.PATCH format, got: $CURRENT_VERSION" >&2
              exit 1
            fi
            CURRENT_MAJOR="${BASH_REMATCH[1]}"
            CURRENT_MINOR="${BASH_REMATCH[2]}"
            CURRENT_PATCH="${BASH_REMATCH[3]}"
            if [[ ! "$BASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Base $FILE must use MAJOR.MINOR.PATCH format, got: $BASE_VERSION" >&2
              exit 1
            fi
            BASE_MAJOR="${BASH_REMATCH[1]}"
            BASE_MINOR="${BASH_REMATCH[2]}"
            BASE_PATCH="${BASH_REMATCH[3]}"
            if [[ "$CURRENT_MAJOR.$CURRENT_MINOR" != "$BASE_MAJOR.$BASE_MINOR" ]]; then
              NEW="$CURRENT_VERSION"
            else
              # Never step a patch backwards: a PR that already carries a
              # higher patch keeps it instead of dropping to base + 1.
              if (( CURRENT_PATCH > BASE_PATCH + 1 )); then
                NEW="$CURRENT_VERSION"
              else
                NEW="$BASE_MAJOR.$BASE_MINOR.$((BASE_PATCH + 1))"
              fi
            fi
            echo "$NEW" > "$FILE"
            echo "$NEW"
          }

          VERSIONS=()
          if [[ "$BUMP_SERVER" == true ]]; then
            NEW_SERVER=$(bump_file VERSION)
            VERSIONS+=("server $NEW_SERVER")
          fi
          if [[ "$BUMP_CLIENT" == true ]]; then
            NEW_CLIENT=$(bump_file client/VERSION)
            VERSIONS+=("client $NEW_CLIENT")
          fi
          if (( ${#VERSIONS[@]} > 0 )); then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "new_version=${VERSIONS[*]}" >> "$GITHUB_OUTPUT"
          fi

      - uses: stefanzweifel/git-auto-commit-action@v5
        if: steps.bump.outputs.changed == 'true'
        with:
          commit_message: "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          file_pattern: VERSION client/VERSION
