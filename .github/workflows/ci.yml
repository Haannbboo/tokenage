name: CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode plugin dependencies
        run: npm ci
        working-directory: plugins/opencode

      - name: Install Kilo plugin dependencies
        run: npm ci
        working-directory: plugins/kilo

      - name: Build plugins
        run: npm run build --prefix plugins/opencode && npm run build --prefix plugins/kilo

      - name: Install backend dependencies
        run: python -m pip install uv && uv pip install --system -r src/pyproject.toml --extra dev

      - name: Create test config
        run: |
          mkdir -p ~/.tokenage
          cp config.example.yaml ~/.tokenage/config.yaml

      - name: Ruff format and lint
        # Same version as .pre-commit-config.yaml; an unpinned ruff changes
        # lint results under unrelated PRs.
        run: |
          python -m pip install ruff==0.15.20
          python -m ruff format --check . && python -m ruff check src/ client/ protocol/ tests/

      - name: Import contracts
        run: lint-imports

      - name: Mypy type check
        run: python -m mypy src/ client/ protocol/ --ignore-missing-imports

      - name: Run backend tests with coverage
        run: python -m pytest -q -n auto --cov=src --cov-report=term-missing --cov-fail-under=75

  hosted-client:
    name: Hosted install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode plugin dependencies
        run: npm ci
        working-directory: plugins/opencode

      - name: Install Kilo plugin dependencies
        run: npm ci
        working-directory: plugins/kilo

      - name: Build plugins from source
        run: npm run build --prefix plugins/opencode && npm run build --prefix plugins/kilo

      - name: Install client test dependencies
        run: python -m pip install uv && uv pip install --system -r client/pyproject.toml pytest

      - name: Test source install, login, and plugin builds
        run: python -m pytest tests/client/ tests/scripts/test_install.py -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install --no-package-lock

      - name: Build frontend
        run: npm run build
