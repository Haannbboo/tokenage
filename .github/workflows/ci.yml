name: CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TOKENAGE_TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode plugin dependencies
        run: npm ci
        working-directory: plugins/opencode

      - name: Install Kilo plugin dependencies
        run: npm ci
        working-directory: plugins/kilo

      - name: Build plugins
        run: npm run build --prefix plugins/opencode && npm run build --prefix plugins/kilo

      - name: Install backend dependencies
        run: python -m pip install uv && uv pip install --system -r src/pyproject.toml --extra dev

      - name: Create test config
        run: |
          mkdir -p ~/.tokenage
          cp config.example.yaml ~/.tokenage/config.yaml

      - name: Ruff format and lint
        # Same version as .pre-commit-config.yaml; an unpinned ruff changes
        # lint results under unrelated PRs.
        run: |
          python -m pip install ruff==0.17.0
          python -m ruff format --check . && python -m ruff check src/ client/ protocol/ tests/

      - name: Import contracts
        run: lint-imports

      - name: Mypy type check
        run: python -m mypy src/ client/ protocol/ --ignore-missing-imports

      - name: Run backend tests with coverage
        run: python -m pytest -q -n auto --cov=src --cov-report=term-missing --cov-fail-under=75

  postgres:
    # SQLite is the default backend for local runs and the backend job above.
    # This job runs the suite against Postgres, but only when something that
    # can behave differently there changed.
    name: Postgres
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for database changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Anything that cannot be diffed runs the tests rather than skips them.
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/${BASE_REF}...HEAD"
          else
            range="${BEFORE}...HEAD"
          fi
          if ! files=$(git diff --name-only "$range" 2>/dev/null); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$files" | grep -Eq '^(src/database/|src/auth/|tests/test_auth_activity\.py$|src/schema_migrations\.py$|tests/conftest\.py$|tests/test_database\.py$|tests/test_tenancy_pg\.py$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No database changes; skipping Postgres tests."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start Postgres
        if: steps.changes.outputs.run == 'true'
        # A service container cannot take server flags. The suite opens more
        # than the default 100 connections across its engines.
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=tokenage_test \
            postgres:16 -c max_connections=300
          for _ in $(seq 30); do
            docker exec pg pg_isready -U postgres -d tokenage_test && exit 0
            sleep 1
          done
          docker logs pg
          exit 1

      - name: Set up Python
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        if: steps.changes.outputs.run == 'true'
        run: python -m pip install uv && uv pip install --system -r src/pyproject.toml --extra dev

      - name: Create test config
        if: steps.changes.outputs.run == 'true'
        run: |
          mkdir -p ~/.tokenage
          cp config.example.yaml ~/.tokenage/config.yaml

      - name: Run backend tests against Postgres
        if: steps.changes.outputs.run == 'true'
        # Serial: every test shares the one scratch database.
        env:
          TOKENAGE_TEST_PG_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tokenage_test
        run: python -m pytest -q --ignore=tests/client --ignore=tests/scripts

  hosted-client:
    name: Hosted install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode plugin dependencies
        run: npm ci
        working-directory: plugins/opencode

      - name: Install Kilo plugin dependencies
        run: npm ci
        working-directory: plugins/kilo

      - name: Build plugins from source
        run: npm run build --prefix plugins/opencode && npm run build --prefix plugins/kilo

      - name: Install client test dependencies
        run: python -m pip install uv && uv pip install --system -r client/pyproject.toml pytest

      - name: Test source install, login, and plugin builds
        run: python -m pytest tests/client/ tests/scripts/test_install.py -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install --no-package-lock

      - name: Build frontend
        run: npm run build
