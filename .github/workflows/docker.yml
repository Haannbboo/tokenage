name: Docker
"on":
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - config.example.yaml
      - install.sh
      - VERSION
      - src/**
      - protocol/**
      - frontend/**
      - .github/workflows/docker.yml
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:
    inputs:
      keep_versions:
        description: Number of newest tagged versions to keep
        type: number
        default: 20
        required: true
permissions: {}
jobs:
  smoke:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: tokenage:smoke
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: ./docker/smoke.sh
  publish:
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-tokenage
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image tags
        id: tags
        run: |
          version=$(cat VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "series=${version%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/haannbboo/tokenage:${{ steps.tags.outputs.version }}
            ghcr.io/haannbboo/tokenage:${{ steps.tags.outputs.series }}
            ghcr.io/haannbboo/tokenage:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  cleanup:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      packages: write
    concurrency:
      group: ghcr-tokenage
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Validate retention count
        env:
          KEEP_VERSIONS: ${{ inputs.keep_versions || 20 }}
        run: |
          if ! [[ "$KEEP_VERSIONS" =~ ^[1-9][0-9]*$ ]]; then
            echo "keep_versions must be a positive integer" >&2
            exit 1
          fi
      # This action removes index children from the candidate set before applying
      # retention, then deletes children only with their deleted parent index.
      # https://github.com/dataaxiom/ghcr-cleanup-action#cleanup-algorithm
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          owner: haannbboo
          package: tokenage
          keep-n-tagged: ${{ inputs.keep_versions || 20 }}
          delete-untagged: "true"
          validate: "true"
