name: release-tags

"on":
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-tags
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag missing releases
        env:
          AFTER: ${{ github.sha }}
        run: python3 .github/scripts/release_tags.py --ref "$AFTER" --apply --push
