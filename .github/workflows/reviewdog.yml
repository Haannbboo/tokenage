name: PR annotations

"on":
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  ruff:
    name: Ruff reviewdog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python -m pip install "ruff==0.17.0"

      - name: Set up reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Annotate Python style issues
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python -m ruff check --exit-zero --output-format=rdjson . \
            | reviewdog -f=rdjson -name=ruff -reporter=github-pr-review -filter-mode=diff_context -fail-level=error
