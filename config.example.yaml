pricing:
  # Auto-fetch model pricing from the configured sources on startup and config
  # refresh. Each source caches locally under ~/.tokenage/pricing/.
  # Set to false to disable and rely on YAML-only pricing.
  auto_fetch: true
  # Ranked price sources: earlier entries win collisions, later ones fill gaps.
  # YAML `models:` overrides always take precedence. Absent list
  # defaults to litellm only.
  sources:
    - name: openrouter
      type: openrouter
      enabled: true
      ttl_seconds: 21600   # 6h; OpenRouter lists new models quickly
    - name: litellm
      type: litellm
      enabled: true

models:
  # Pricing is auto-fetched from LiteLLM. Only add cost blocks here to
  # override specific models (e.g. enterprise discounts, custom models).

  # Models not covered by LiteLLM
  minimax-m2.7-highspeed:
    cost:
      input: 0.6
      output: 2.4
      cacheRead: 0.06
  minimax-m2.5-highspeed:
    cost:
      input: 0.6
      output: 2.4
      cacheRead: 0.03

  # Z-AI / GLM (not in LiteLLM)
  z-ai/glm-5.1-20260406:
    cost:
      input: 0.98
      output: 3.08
      cacheRead: 0.182

  # Xiaomi Mimo (not in LiteLLM)
  mimo-v2-omni:
    cost:
      input: 0.4
      output: 2.0
      cacheRead: 0.08

  # Doubao (Volcengine)
  doubao-seed-2-1-turbo-260628:
    cost:
      input: 0.42
      output: 2.1
      cacheRead: 0.084

server:
  # Base URL for the URLs handed to clients (dashboard, OTLP at <url>/otlp).
  # When set, overrides 'host' for URL generation (e.g. http://my-nas).
  # The port still comes from api_port below.
  # Leave commented for local-only usage (defaults to http://localhost).
  # base_url: http://my-nas
  host: 127.0.0.1       # bind address: 127.0.0.1 = local only, 0.0.0.0 = all interfaces
  api_port: 4001

db:
  path: ~/.tokenage/usage.db
  # For PostgreSQL/MySQL, use `url` instead of `path`, for example:
  # url: postgresql+psycopg://user:password@db-host:5432/tokenage
  # url: mysql+pymysql://user:password@db-host:3306/tokenage

# auth:
#   provider: local   # local (default): one built-in owner; requests straight from
#                     # this machine need no token, others use a token or
#                     # `tokenage server login-link`. google: hosted Google sign-in.
#   # google_client_id / google_client_secret / allowlist apply to `google` only.
