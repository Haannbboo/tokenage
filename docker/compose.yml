services:
  tokenage:
    image: ghcr.io/haannbboo/tokenage:${TOKENAGE_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${TOKENAGE_PORT:-4001}:4001"
    volumes:
      - tokenage-data:/data
      - type: bind
        source: ./config.yaml
        target: /data/config.yaml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    extra_hosts:
      - host.docker.internal:host-gateway
  postgres:
    profiles: [postgres]
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tokenage
      POSTGRES_DB: tokenage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tokenage}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tokenage -d tokenage"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    profiles: [redis]
    image: redis:7.4
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory-policy, noeviction]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  nginx:
    profiles: [nginx]
    image: nginx:1.28
    depends_on:
      tokenage:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - type: bind
        source: ./nginx
        target: /etc/nginx/conf.d
        read_only: true
        bind:
          create_host_path: false
volumes:
  tokenage-data:
  postgres-data:
  redis-data:
