pricing:
  # Auto-fetch model pricing from the configured sources on startup and config
  # refresh. Each source caches locally under ~/.tokenage/pricing/.
  # Set to false to disable and rely on YAML-only pricing.
  auto_fetch: true
  # Ranked price sources: earlier entries win collisions, later ones fill gaps.
  # YAML `models:` overrides always take precedence. Absent list
  # defaults to litellm only.
  sources:
    - name: openrouter
      type: openrouter
      enabled: true
      ttl_seconds: 21600   # 6h; OpenRouter lists new models quickly
    - name: litellm
      type: litellm
      enabled: true

models:
  # Pricing is auto-fetched from LiteLLM. Only add cost blocks here to
  # override specific models (e.g. enterprise discounts, custom models).

  # Models not covered by LiteLLM
  minimax-m2.7-highspeed:
    cost:
      input: 0.6
      output: 2.4
      cacheRead: 0.06
  minimax-m2.5-highspeed:
    cost:
      input: 0.6
      output: 2.4
      cacheRead: 0.03

  # Z-AI / GLM (not in LiteLLM)
  z-ai/glm-5.1-20260406:
    cost:
      input: 0.98
      output: 3.08
      cacheRead: 0.182

  # Xiaomi Mimo (not in LiteLLM)
  mimo-v2-omni:
    cost:
      input: 0.4
      output: 2.0
      cacheRead: 0.08

  # Doubao (Volcengine)
  doubao-seed-2-1-turbo-260628:
    cost:
      input: 0.42
      output: 2.1
      cacheRead: 0.084

server:
  # Complete public origin for URLs handed to clients (OTLP at <url>/otlp).
  # Include a port unless a proxy serves the default port 80/443.
  # Leave commented for local-only usage (defaults to http://localhost:<api_port>).
  # base_url: http://my-nas:4001
  host: 127.0.0.1       # bind address: 127.0.0.1 = local only, 0.0.0.0 = all interfaces
  api_port: 4001
  # API processes (default 2), each with an ingest consumer. Integer >= 1.
  # Each adds up to 4 auth threads and 15 DB connections (5 + 10 overflow).
  # Budget workers * 15 connections per node within the PostgreSQL limit.
  # workers: 2

# Optional unauthenticated Prometheus listener. Never publish/proxy this port.
# Bind loopback (same-host scraper) or a private/tailnet interface; in Docker,
# use 0.0.0.0 for a scraper on the same network, without a compose ports mapping.
metrics:
  enabled: false
  host: 127.0.0.1
  # port: 9108  # required when enabled; must differ from the resolved API port
  # allowed_hosts: [tokenage]  # Docker service name, or private IP/MagicDNS name
  # Loopback binds only accept loopback Host names, regardless of this list.

db: {}
  # When unset, path defaults to $TOKENAGE_HOME/usage.db.
  # path: ~/.tokenage/usage.db
  # For PostgreSQL/MySQL, use `url` instead of `path`, for example:
  # url: postgresql+psycopg://user:password@db-host:5432/tokenage
  # url: mysql+pymysql://user:password@db-host:3306/tokenage

# auth:
#   provider: local   # local (default): one built-in owner; requests straight from
#                     # this machine need no token, others use a token or
#                     # `tokenage server login-link`. google: hosted Google sign-in.
#   # google_client_id / google_client_secret / allowlist apply to `google` only.

# Event queue + shared state (leases, rate limits, sign-in codes).
# Unset → SQLite file on this machine ($TOKENAGE_HOME/state.db).
# queue:
#   url: sqlite:////path/to/state.db  # TOKENAGE_QUEUE_URL overrides this.
#   prefix: "tokenage:"
#   # Redis: redis://:password@redis-host:6379/0 (percent-encode the password).
#   # TLS: rediss://...?ssl_ca_certs=/path/ca.pem when the server CA is not in the
#   # system trust store (e.g. GCP Memorystore, which also listens on 6378).
#   # Single-node Redis >= 6.2; no Cluster/Sentinel. Use a dedicated DB or a unique
#   # queue.prefix per installation. Self-hosted: appendonly yes, appendfsync
#   # everysec (up to 1s crash loss), maxmemory-policy noeviction. Managed Redis
#   # may only offer snapshots (Memorystore: RDB, no AOF).
#   # Multi-machine needs Redis AND a shared Postgres usage DB; a local SQLite
#   # usage DB per host misroutes rows. Delivery is at-least-once: a Redis timeout
#   # after a write, or a failed post-commit flush, can duplicate usage rows.
#   # Switch stores only at zero queue lag (`tokenage server status`);
#   # pending events and sign-in state are not migrated between stores.
