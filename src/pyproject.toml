# The server's dependencies. Installers read them with `uv pip install -r src/pyproject.toml`;
# `--extra dev` adds the test and lint tools. `server start` refuses to run when this file
# changed since the last `tokenage server bootstrap`.
[project]
name = "tokenage-server"
description = "tokenage server: API, OTLP collector, dashboard, usage and evaluation storage"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.31",
    "uvicorn>=0.30",
    "gunicorn>=23.0",
    "httpx>=0.27",
    "pydantic>=2,<3",
    "authlib>=1.3,<1.8",
    "joserfc>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "supervisor>=4.2",
    "sqlalchemy>=2.1.1,<2.2",
    "psycopg[binary]>=3.2",
    "pymysql>=1.1",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-cov>=7.0",
    "mypy>=2.3.1,<2.4",
    "ruff==0.17.0",
    "import-linter>=2.0",
]

# ponytail: metadata for installers, not a built package; building needs VERSION inside the project.
[tool.setuptools.dynamic]
version = { file = ["../VERSION"] }
